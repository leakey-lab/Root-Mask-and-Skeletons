# Hooks that parse the sources (debug-statements) must run on Python 3.14: older versions
# cannot parse the PEP 758 `except A, B:` lines ruff format writes (KNOWN_ISSUES U5).
default_language_version:
  python: python3.14
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # vendored unmodified (app/assets/THIRD_PARTY.md); upstream has no final newline
        exclude: ^app/assets/plotly-basic\.min\.js$
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: debug-statements
