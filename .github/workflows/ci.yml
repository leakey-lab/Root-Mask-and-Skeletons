name: CI

on:
  push:
    branches: [main, v3, "refactor/**", "feat/**", "fix/**"]
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The app runs on Windows, Linux and macOS (O21); macOS runs on Apple silicon, CPU only.
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash  # every step stops at its first failing command, on all three OSes
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install system libs for Qt/OpenCV (headless)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3

      - name: Install PyTorch (CPU)
        # Same release as the recommended GPU build (README "Installation"), CPU wheels:
        # CI only needs the inference modules to import and run on CPU.
        run: pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (advisory)
        continue-on-error: true
        run: ruff check .

      - name: Test suite
        # Remove after the first green macOS run (WX-T6 step 8): the one OS not run locally.
        continue-on-error: ${{ matrix.os == 'macos-latest' }}
        run: pytest -q -rfE

      - name: Dashboard blink probe on the native platform (D8, non-blocking)
        # The suite runs Qt offscreen, where no window is ever recreated. This step runs the
        # real window on the runner's own platform (Cocoa on macOS, X11 under xvfb on Linux)
        # through the dashboards and asks whether the main window is recreated, and on Linux
        # whether the renderer keeps Chromium's sandbox as a normal user
        # (tests/test_dashboard_native_platform.py; Windows: its release_native test in the suite).
        # Non-blocking: macOS is unanswered (no fix there yet). A failure shows on this step;
        # the job stays green. Make the Linux run blocking once it has passed twice.
        if: runner.os != 'Windows'
        continue-on-error: true
        env:
          SPROUTS_NATIVE_PLATFORM_PROBE: "1"
        run: |
          unset QT_QPA_PLATFORM  # the platform's own default for this step
          probe="pytest tests/test_dashboard_native_platform.py -s -rA -p no:cacheprovider"
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Qt's X11 plugin and QtWebEngine need these beyond the runner image.
            sudo apt-get install -y xvfb libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
              libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
              libxkbcommon-x11-0 libnss3
            xvfb-run -a -s "-screen 0 1600x1000x24" $probe
          else
            $probe
          fi

  package:
    name: wheel builds and installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build the wheel
        run: python -m pip wheel --no-deps -w dist .

      - name: Install it in a clean venv and check what the app loads at run time
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --no-deps dist/*.whl
          cd /tmp  # import from site-packages, not from the checkout
          /tmp/wheel-venv/bin/python - <<'EOF'
          import importlib.metadata as md
          import os

          import app
          from resources.resource_utils import get_resource_path

          assert md.version("root-mask-and-skeletons") == app.__version__
          for rel in (
              "resources/themes/dark_theme.qss",
              "resources/icons/sprouts/sprouts_logo.svg",
              "resources/app_icon.ico",
              "app/assets/style.css",
          ):
              assert os.path.isfile(get_resource_path(rel)), rel
          scripts = {e.name: e.value for e in md.entry_points(group="console_scripts")}
          assert scripts.get("sprouts") == "main:main", scripts
          print("wheel OK:", app.__version__)
          EOF

  citation:
    name: CITATION.cff is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate CITATION.cff (Citation File Format 1.2.0)
        uses: citation-file-format/cffconvert-github-action@2.0.0
        with:
          args: "--validate"
